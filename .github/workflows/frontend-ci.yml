name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "backend-go/internal/infrastructure/http/apidocs/openapi.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend-go/internal/infrastructure/http/apidocs/openapi.json"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.course-ai.test
      # Encoded dummy host clerk.course-ai.test$; validates syntax, not real authentication.
      VITE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuY291cnNlLWFpLnRlc3Qk
      VITE_E2E_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify generated API types
        run: npm run api:check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Build with Vercel production validation
        run: npm run build
        env:
          VERCEL_ENV: production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
