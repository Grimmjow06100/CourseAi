<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/course-ai-mark-v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const theme = localStorage.getItem('course-ai-theme')
        document.documentElement.classList.toggle(
          'dark',
          theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches),
        )
      } catch {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches)
      }
    </script>
    <meta
      name="description"
      content="Course AI transforme un objectif technique en formation structurée et interactive."
    />
    <title>Course AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
